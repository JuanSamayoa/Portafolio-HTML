name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Mínimo privilegio por defecto: el workflow solo necesita leer el repositorio.
# El job de despliegue eleva el permiso únicamente donde GitHub Pages lo exige.
permissions:
  contents: read

# Publicaciones secuenciales: nunca se cancela un despliegue en curso para no
# interrumpir una publicación activa de GitHub Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # pnpm antes de setup-node para que la caché de setup-node encuentre el store.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Astro build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .astro
            node_modules/.vite
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            astro-${{ runner.os }}-

      # Instalación reproducible: sin resolver versiones nuevas ni ejecutar scripts de paquetes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false --ignore-scripts

      # Puerta de calidad previa al empaquetado: nada roto llega a Pages.
      - name: Type and template check
        run: pnpm astro check

      - name: Test reference checker
        run: pnpm test:links

      - name: Build site
        run: pnpm build

      - name: Check local references
        run: pnpm check:links

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist
          retention-days: 1

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Única elevación de privilegios del workflow, limitada a la publicación.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
