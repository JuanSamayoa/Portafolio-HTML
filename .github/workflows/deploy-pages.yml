name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Mínimo privilegio por defecto: el workflow solo necesita leer el repositorio.
# El job de despliegue eleva el permiso únicamente donde GitHub Pages lo exige.
permissions:
  contents: read

# Publicaciones secuenciales: nunca se cancela un despliegue en curso para no
# interrumpir una publicación activa de GitHub Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pnpm antes de setup-node para que la caché de setup-node encuentre el store.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Astro build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .astro
            node_modules/.vite
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            astro-${{ runner.os }}-

      # Instalación reproducible: sin resolver versiones nuevas ni ejecutar scripts de paquetes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false --ignore-scripts

      # Puerta de calidad previa al empaquetado: nada roto llega a Pages.
      - name: Type and template check
        run: pnpm astro check

      - name: Test reference checker
        run: pnpm test:links

      - name: Build site
        run: pnpm build

      - name: Check local references
        run: pnpm check:links

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          retention-days: 1

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Única elevación de privilegios del workflow, limitada a la publicación.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
